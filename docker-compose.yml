services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projetab
      POSTGRES_USER: projetab
      POSTGRES_PASSWORD: projetab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projetab -d projetab"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4001:4001"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: projetab
      PGUSER: projetab
      PGPASSWORD: projetab
      BACKEND_PORT: 4001
      NODE_ENV: production
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX: ${PINECONE_INDEX:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}

volumes:
  pgdata:
